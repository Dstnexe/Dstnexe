name: update

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
      - run: |
          git config user.name "Dstnexe"
          git config user.email "dustinwitt18@gmail.com"
          git add dark.svg light.svg
          git diff --cached --quiet || git commit -m "Refresh profile stats"
          git push
